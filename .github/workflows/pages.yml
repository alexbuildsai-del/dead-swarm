# Builds the free web demo (DS_DEMO=1) and publishes it to GitHub Pages: the full game is not free on the web.
# Each run also attaches two zips (index.html at the root): dead-swarm-demo-itch (upload to itch.io) and
# dead-swarm-full (the full game, for private playtests).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/peaceful-feynman-sffvzy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the demo and the full game
        run: bash tools/release/itch.sh
      - name: Collect site (the demo)
        run: |
          mkdir -p site
          cp build/demo/index.html site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dead-swarm-demo-itch
          path: build/release/dead-swarm-demo-itch.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dead-swarm-full
          path: build/release/dead-swarm-full.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
